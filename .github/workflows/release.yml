name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: harpy-linux-x86_64
            executable: dist/harpy-linux-x86_64
          - os: macos-latest
            asset_name: harpy-macos-arm64
            executable: dist/harpy-macos-arm64
          - os: windows-latest
            asset_name: harpy-windows-x86_64.exe
            executable: dist/harpy-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]" pyinstaller

      - name: Create entry script
        shell: bash
        run: |
          echo "from harpy.cli import main; import sys; sys.exit(main())" > entry.py

      - name: Build standalone executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --name "${{ matrix.asset_name }}" --paths . --clean entry.py

      - name: Verify binary executes
        shell: bash
        run: |
          ${{ matrix.executable }} --version
          ${{ matrix.executable }} --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheel and sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          # Copy Python packages
          cp dist/*.whl release-assets/
          cp dist/*.tar.gz release-assets/
          # Copy compiled binaries
          find artifacts -type f -exec cp {} release-assets/ \;
          # Make linux/macos binaries executable
          chmod +x release-assets/harpy-linux-x86_64 release-assets/harpy-macos-arm64 || true
          # Generate SHA256 checksums
          cd release-assets
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt
          cd ..
          ls -la release-assets/

      - name: Determine tag name
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            echo "tag=v${PKG_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
