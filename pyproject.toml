[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harpy-cp"
version = "0.1.5"
description = "AI-assisted competitive programming & interview prep toolkit: LeetCode-style problem formulation, verified test case generation, CPH integration, and local runner."
authors = [{ name = "Harpy Developers" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["competitive-programming", "dsa", "leetcode", "codeforces", "cph", "mcp", "ai-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
harpy = "harpy.cli:main"

[project.urls]
Homepage = "https://github.com/seronic/harpy"
Repository = "https://github.com/seronic/harpy"
Issues = "https://github.com/seronic/harpy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["harpy*"]
