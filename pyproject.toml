[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harpy-cp"
version = "0.1.0"
description = "AI-assisted competitive programming & interview prep toolkit: LeetCode-style problem formulation, verified test case generation, CPH integration, and local runner."
authors = [{ name = "Harpy Developers" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
harpy = "harpy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harpy*"]
